<!DOCTYPE html>
<html lang="ca">
  <head>
    <meta charset="UTF-8" />
    <title>Funcions de transició — demos + gràfic per tipus</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Guia d’estil</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    
    <link rel="stylesheet" href="estils.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-link">Home</a>
            <a href="galeria.html" class="nav-link">Galeria</a>
            <a href="guia-estil.html" class="nav-link active">Guia d’estil</a>
        </div>
    </nav>

    <!-- Tipografia -->
    <section class="typography">
        <h1>Playfair Display</h1>
        <h2>Inter 600</h2>
        <h3>Inter 700</h3>
        <p class="text-light">Inter 400 – line-height: 1.6</p>
        <p class="text-bold">Inter 700 – letter-spacing: 0.5px</p>
        
        <div class="baseline">
            <span class="material-symbols-outlined">star</span>
            <span>Icona alineada amb text</span>
        </div>
    </section>

    <!-- Material Icons -->
    <section class="icons-showcase">
        <h2>Material Icons</h2>
        <div class="icon-grid">
            <div>
                <span class="material-symbols-outlined icon-sm">home</span>
                <p>20px</p>
            </div>
            <div>
                <span class="material-symbols-outlined icon-md">favorite</span>
                <p>32px</p>
            </div>
            <div>
                <span class="material-symbols-outlined icon-lg">settings</span>
                <p>48px</p>
            </div>
        </div>
        <button class="btn-icon">
            <span class="material-symbols-outlined">download</span>
            Descarrega
        </button>
    </section>

    <!-- Colors -->
    <section class="colors">
        <h2>Paleta</h2>
        <table>
            <tr>
                <td class="color-swatch" style="background: #4a6fa5;"></td>
                <td>#4a6fa5</td>
                <td>rgb(74, 111, 165)</td>
                <td>hsl(214, 38%, 47%)</td>
                <td>rgba(74, 111, 165, 0.8)</td>
            </tr>
        </table>
    </section>
</body>
</html>
